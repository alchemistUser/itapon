# SPDX-License-Identifier: AGPL-3.0-or-later
# Production database (Phase 24): on merge to main, apply new migrations and the content seed
# to the PRODUCTION Supabase project, then run the RLS role matrix there (rolled back).
# Migrations are roll-forward only; never edit prod by hand (docs/release.md).
#
# Needs, in the GitHub "production" environment:
#   secrets   SUPABASE_ACCESS_TOKEN, SUPABASE_PROD_DB_PASSWORD
#   variable  SUPABASE_PROD_PROJECT_REF
# Until they're set the job only prints a reminder.
name: Database (production)

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "supabase/seed.sql", ".github/workflows/db.yml"]
  workflow_dispatch:

concurrency:
  group: db-production
  cancel-in-progress: false # never interrupt a migration

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROD_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check access
        id: access
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Production Supabase not configured yet; no migrations were applied."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.access.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.access.outputs.ok == 'true'
        with:
          node-version: 20
          cache: pnpm
      - if: steps.access.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - name: Link production
        if: steps.access.outputs.ok == 'true'
        run: npx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Pending migrations (dry run)
        if: steps.access.outputs.ok == 'true'
        run: npx supabase db push --dry-run --include-seed --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations + seed
        if: steps.access.outputs.ok == 'true'
        run: npx supabase db push --include-seed --yes --password "$SUPABASE_DB_PASSWORD"
      - name: RLS role matrix on production (rolled back)
        if: steps.access.outputs.ok == 'true'
        run: node supabase/tests/run-rls-roles.mjs
