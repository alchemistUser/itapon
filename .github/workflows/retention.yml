# SPDX-License-Identifier: AGPL-3.0-or-later
# Data retention (Phase 22): delete shared feedback photos older than 12 months, as the
# privacy notice promises. Needs repository secrets SUPABASE_URL and
# SUPABASE_SERVICE_ROLE_KEY; until they're set the job only prints a reminder.
name: Retention

on:
  schedule:
    - cron: "0 18 1 * *" # 02:00 Philippine time on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge-photos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml-api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Retention secrets not set; no photos were purged."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v5
        if: steps.secrets.outputs.ok == 'true'
      - name: Purge photos older than 12 months
        if: steps.secrets.outputs.ok == 'true'
        run: uv run python scripts/purge_feedback_photos.py --months 12
      - name: Purge client error logs older than 90 days
        if: steps.secrets.outputs.ok == 'true'
        run: |
          curl -sSf -X POST "$SUPABASE_URL/rest/v1/rpc/purge_client_errors"             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H "Content-Type: application/json" -d '{"p_days": 90}'
