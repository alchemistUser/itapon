name: Model export

# Manual: rebuild the YOLO-World model artifacts for the browser (D12) and attach them
# to the run. Publishing to the Hugging Face model repo stays a reviewed, manual step.
on:
  workflow_dispatch:
    inputs:
      imgsz:
        description: "Input size(s), space-separated"
        default: "480 640"
        required: true

jobs:
  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --group build
      - name: Build custom-vocabulary weights
        run: uv run --no-sync python scripts/build_world_model.py
      - name: Export ONNX + INT8 variants
        run: |
          for s in ${{ inputs.imgsz }}; do
            uv run --no-sync python scripts/export_onnx.py --imgsz "$s"
            uv run --no-sync python scripts/shrink_onnx.py "weights/itapon-world-v0-$s.onnx"
          done
      - name: Regression test (Phase 23; fails if accuracy drops vs ml/regression-set/baseline.json)
        run: |
          for s in ${{ inputs.imgsz }}; do
            uv run --no-sync python -m scripts.model_regression --set ../../ml/regression-set               --model "weights/itapon-world-v0-$s-int8.onnx"
          done
      - name: Checksums
        run: |
          cd weights
          sha256sum *.onnx itapon-world-v0.labels.json | tee SHA256SUMS
          ls -la *.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: itapon-model-${{ github.sha }}
          path: |
            services/ml-api/weights/*.onnx
            services/ml-api/weights/itapon-world-v0.labels.json
            services/ml-api/weights/itapon-world-v0.json
            services/ml-api/weights/SHA256SUMS
          retention-days: 30
