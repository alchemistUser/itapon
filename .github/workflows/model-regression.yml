# SPDX-License-Identifier: AGPL-3.0-or-later
# Model pin check (Phase 24): whenever the pinned model revision or its hashes change,
# download the exact files the browser will load, verify them against PINNED_SHA256, and run
# the regression set (ml/regression-set) on them.
name: Model regression

on:
  pull_request:
    paths: ["apps/web/src/lib/detector/models.ts", "ml/regression-set/**"]
  push:
    branches: [main]
    paths: ["apps/web/src/lib/detector/models.ts", "ml/regression-set/**"]
  workflow_dispatch:

jobs:
  pinned-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Download pinned files and verify SHA-256
        run: node apps/web/scripts/verify-model-pins.mjs pinned
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Regression set
        working-directory: services/ml-api
        run: |
          uv sync --locked --group build
          for f in ../../pinned/*.onnx; do
            uv run --no-sync python -m scripts.model_regression --set ../../ml/regression-set --model "$f"
          done
