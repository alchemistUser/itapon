name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  e2e:
    name: Web E2E (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # The fake-camera scan test needs a sample photo (private dev samples aren't in git),
      # so it is skipped here; it runs locally and in UAT.
      - run: pnpm --filter web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  api:
    name: ML API (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check . ../../supabase/scripts
      - run: uv run ruff format --check . ../../supabase/scripts
      - run: uv run pytest -q
      - name: Supabase seed is up to date
        working-directory: .
        run: python3 supabase/scripts/build_seed.py --check
      - name: Disposal library content is valid and generated files are up to date
        working-directory: .
        run: python3 supabase/scripts/build_library.py --check

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the CLI directly over full history; gitleaks-action breaks on a repo's root commit.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks
      - run: ./gitleaks git --redact --verbose .

  deps:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Gate on what ships to users; dev-tool advisories are reviewed in docs/security.md.
      - run: pnpm audit --prod --audit-level high
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: pip-audit (ML API runtime deps)
        working-directory: services/ml-api
        run: |
          uv export --locked --no-dev --no-hashes --format requirements-txt             | sed 's/+cpu//' | grep -v '^-e\|^\.' > /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt --no-deps --disable-pip --progress-spinner off

  rls:
    name: RLS role matrix (dev project)
    runs-on: ubuntu-latest
    # Needs the SUPABASE_ACCESS_TOKEN secret; skipped (with a warning) until it is set.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # no pnpm cache: the job may skip the install (no secret yet)
      - name: Check access
        id: access
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret or SUPABASE_PROJECT_REF variable not set; RLS role matrix skipped."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.access.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.access.outputs.ok == 'true'
        run: npx supabase link --project-ref "$PROJECT_REF"
      - if: steps.access.outputs.ok == 'true'
        run: node supabase/tests/run-rls-roles.mjs
