name: Bug report
description: Something is broken or behaves wrongly
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [web, api, ml, db, docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /scan on iPhone Safari
        2. Hold a plastic bottle
        3. ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / browser
      placeholder: iPhone 15, iOS 18, Safari
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
