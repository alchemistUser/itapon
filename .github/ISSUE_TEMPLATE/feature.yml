name: Feature / task
description: A roadmap task or new feature
labels: ["feature"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [web, api, ml, db, docs]
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Roadmap phase
      placeholder: "12"
  - type: input
    id: story
    attributes:
      label: User story (from docs/spec.md §7)
      placeholder: US-01
  - type: textarea
    id: what
    attributes:
      label: What needs to be done
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
