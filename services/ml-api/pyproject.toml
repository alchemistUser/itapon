[project]
name = "itapon-ml-api"
version = "0.2.0"
description = "iTapon waste detection inference API (FastAPI + Ultralytics YOLO)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10",
    "ultralytics>=8.3",
    "torch>=2.4",
    "torchvision>=0.19",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Only needed to build the model artifacts (scripts/build_world_model.py, scripts/export_onnx.py).
# The API itself runs without CLIP because the text embeddings are baked into the saved weights.
build = [
    "clip @ git+https://github.com/ultralytics/CLIP.git",
    "onnx>=1.16",
    "onnxslim>=0.1.40",
    "onnxruntime>=1.19",
]

[tool.uv]
default-groups = ["dev"]

# CPU-only PyTorch wheels: ~5x smaller than CUDA builds; the HF free Space has no GPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: loads the real model (run with -m slow)"]
addopts = "-m 'not slow'"
